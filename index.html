<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sadhana Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Minimal essential styling -->
  <style>
    body {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      background: #f7f5f0;
    }
    #upload-screen,
    #loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
    }
    .drop-zone {
      border: 2px dashed #aaa;
      padding: 24px;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      width: 360px;
    }
    .drop-zone.drag-over {
      border-color: #c4623a;
      background: #fdf5f0;
    }
    #app {
      display: none;
    }
    header {
      background: #fff;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }
    .badge {
      font-size: 11px;
      background: #eee;
      padding: 4px 10px;
      border-radius: 20px;
    }
  </style>
</head>

<body>

<!-- LOADING -->
<div id="loading" style="display:none">
  <div>Loading…</div>
</div>

<!-- UPLOAD -->
<div id="upload-screen">
  <h2>Sadhana Dashboard</h2>

  <button onclick="loadFromGDrive()">Load from Google Drive</button>

  <div class="drop-zone" id="drop-zone">
    <input type="file" id="file-input" accept=".xlsx,.xls" hidden />
    <p>Click or drop Excel file here</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div><b>Sadhana Dashboard</b></div>
    <div class="badge" id="last-updated">⏱ Never updated</div>
  </header>

  <div style="padding:16px">
    <p id="fname">—</p>
    <div id="output">✅ Data loaded successfully</div>
  </div>
</div>

<script>
/* --------------------------------------------------
   CONFIG
-------------------------------------------------- */
const GDRIVE_API =
  "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"; // 🔴 REPLACE

/* --------------------------------------------------
   GLOBAL ERROR VISIBILITY
-------------------------------------------------- */
window.onerror = function (msg, src, line) {
  alert("JavaScript error: " + msg + " (line " + line + ")");
};

/* --------------------------------------------------
   HELPERS
-------------------------------------------------- */
function updateLastUpdated() {
  document.getElementById("last-updated").textContent =
    "⏱ Last updated: " +
    new Date().toLocaleString("en-IN", {
      dateStyle: "medium",
      timeStyle: "short",
    });
}

function cacheWorkbook(buffer) {
  const b64 = btoa(
    String.fromCharCode(...new Uint8Array(buffer))
  );
  localStorage.setItem("sadhana:file", b64);
}

function loadCachedWorkbook() {
  const b64 = localStorage.getItem("sadhana:file");
  if (!b64) return false;
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  parseXLSX(bytes.buffer, "Cached file");
  updateLastUpdated();
  return true;
}

function showApp() {
  document.getElementById("upload-screen").style.display = "none";
  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
}

/* --------------------------------------------------
   VALIDATION
-------------------------------------------------- */
function validateFile(file) {
  const ext = file.name.toLowerCase().split(".").pop();
  if (!["xlsx", "xls"].includes(ext)) {
    alert("Only Excel files allowed");
    return false;
  }
  if (file.size > 5 * 1024 * 1024) {
    alert("File too large (max 5MB)");
    return false;
  }
  return true;
}

/* --------------------------------------------------
   XLSX PARSER (placeholder – hooks into your logic)
-------------------------------------------------- */
function parseXLSX(buffer, name) {
  const wb = XLSX.read(buffer, { type: "array" });
  console.log("Workbook sheets:", wb.SheetNames);
  document.getElementById("fname").textContent = name;
  showApp();
}

/* --------------------------------------------------
   GOOGLE DRIVE
-------------------------------------------------- */
async function loadFromGDrive() {
  try {
    document.getElementById("loading").style.display = "flex";
    const res = await fetch(GDRIVE_API);
    if (!res.ok) throw new Error("Fetch failed");
    const buf = await res.arrayBuffer();
    cacheWorkbook(buf);
    parseXLSX(buf, "Google Drive");
    updateLastUpdated();
  } catch (e) {
    alert("Failed to load from Google Drive");
    console.error(e);
  }
}

/* --------------------------------------------------
   LOCAL FILE UPLOAD
-------------------------------------------------- */
const dropZone = document.getElementById("drop-zone");
const fileInput = document.getElementById("file-input");

dropZone.onclick = () => fileInput.click();

dropZone.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.classList.add("drag-over");
});
dropZone.addEventListener("dragleave", () =>
  dropZone.classList.remove("drag-over")
);
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("drag-over");
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function handleFile(file) {
  if (!validateFile(file)) return;
  document.getElementById("loading").style.display = "flex";
  const r = new FileReader();
  r.onload = e => {
    cacheWorkbook(e.target.result);
    parseXLSX(e.target.result, file.name);
    updateLastUpdated();
  };
  r.readAsArrayBuffer(file);
}

/* --------------------------------------------------
   AUTO‑LOAD CACHED FILE
-------------------------------------------------- */
window.addEventListener("DOMContentLoaded", () => {
  if (loadCachedWorkbook()) showApp();
});
</script>

</body>
</html>
