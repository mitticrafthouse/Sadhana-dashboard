<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sadhana Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body {
  margin: 0;
  font-family: "DM Sans", sans-serif;
  background: #f7f5f0;
  color: #1a1814;
}

#upload-screen, #loading {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}

button {
  padding: 8px 18px;
  border-radius: 8px;
  border: none;
  background: #c4623a;
  color: #fff;
  cursor: pointer;
  font-weight: 500;
}

button:hover { background: #a04e2a; }

.drop-zone {
  width: 360px;
  background: #fff;
  border: 2px dashed #bbb;
  border-radius: 14px;
  padding: 22px;
  text-align: center;
  cursor: pointer;
}

.drop-zone.drag-over {
  border-color: #c4623a;
  background: #fdf5f0;
}

header {
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.badge {
  font-size: 11px;
  background: #eee;
  padding: 4px 10px;
  border-radius: 20px;
}

#app { display: none; }

#content {
  padding: 16px;
}
</style>
</head>

<body>
