<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadhana Dashboard Enhanced</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F5F0;--surface:#fff;--s2:#F0EDE6;--border:rgba(0,0,0,0.08);--text:#1A1814;--t2:#6B6660;--t3:#9E9993;--accent:#C4623A;--green:#2D6A4F;--blue:#1B4F8A;--r:10px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;min-height:100vh;overflow:hidden}

/* UPLOAD */
#upload-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;gap:1.4rem;overflow:auto}
.brand h1{font-family:'DM Serif Display',serif;font-size:3rem;letter-spacing:-.02em;text-align:center;line-height:1}
.brand h1 em{color:var(--accent);font-style:italic}
.brand p{color:var(--t2);font-size:.9rem;text-align:center;margin-top:.4rem;font-weight:300}

.drop-zone{width:100%;max-width:400px;border:1.5px dashed var(--border);border-radius:14px;padding:1.4rem 2rem;text-align:center;cursor:pointer;background:var(--surface);transition:.2s;position:relative}
.drop-zone:hover,.drop-zone.drag-over{background:#FDF5F0;border-color:var(--accent)}
.drop-icon{width:38px;height:38px;background:var(--s2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto .6rem}
.drop-icon svg{width:18px;height:18px;stroke:var(--t2);fill:none;stroke-width:1.5}
.drop-zone h3{font-size:.85rem;font-weight:500;margin-bottom:.15rem;color:var(--t2)}
.drop-zone p{font-size:.7rem;color:var(--t3)}
#file-input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* APP SHELL */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.2rem;display:flex;align-items:center;justify-content:space-between;height:44px;flex-shrink:0}
.hbrand{font-family:'DM Serif Display',serif;font-size:1.15rem}
.hbrand span{color:var(--accent);font-style:italic}
.hright{display:flex;align-items:center;gap:8px}
.fname{font-size:10px;color:var(--t3);background:var(--s2);padding:2px 8px;border-radius:20px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-sm{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--t2);cursor:pointer;transition:.15s}
.btn-sm:hover{background:var(--s2);color:var(--text)}
.btn-export{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 12px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:4px}
.btn-export:hover{background:#A04E2A}

/* FILTER BAR */
.fbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.2rem;display:flex;align-items:center;overflow-x:auto;flex-shrink:0;height:auto;-webkit-overflow-scrolling:touch;flex-wrap:wrap;gap:1rem;padding:0.8rem 1.2rem}
.fgrp{display:flex;align-items:center;gap:8px;height:100%;flex-shrink:0}
.fgrp label{font-size:10px;color:var(--t3);margin-right:4px;white-space:nowrap;font-weight:500}
.fpill{padding:4px 12px;border-radius:20px;border:1px solid transparent;background:none;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--t2);cursor:pointer;transition:.15s;white-space:nowrap}
.fpill:hover{background:var(--s2);color:var(--text)}
.fpill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.select-box{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text);background:var(--surface);cursor:pointer;transition:.15s}
.select-box:hover{border-color:var(--accent)}
.select-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(196,98,58,0.1)}

.date-input{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text);background:var(--surface);cursor:pointer}
.date-input:focus{outline:none;border-color:var(--accent)}

/* BODY */
.body-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* DASHBOARD GRID */
.dgrid{padding:.7rem 1.2rem .4rem;display:grid;grid-template-columns:repeat(12,1fr);gap:7px;flex-shrink:0}

/* KPI row */
.kpi-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.kpi{background:var(--surface);border-radius:var(--r);padding:8px 11px;border:1px solid var(--border);border-top:3px solid var(--kc,var(--accent));cursor:pointer;transition:.15s;position:relative}
.kpi:hover,.kpi.active{box-shadow:0 0 0 2px var(--kc,var(--accent))}
.kpi-lbl{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.kpi-val{font-size:1rem;font-weight:600;line-height:1.1}
.kpi-val.neg{color:#B53C3C}
.kpi-val.pos{color:var(--green)}
.kpi-sub{font-size:9px;color:var(--t3);margin-top:1px}

/* chart cards */
.cc{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:9px 11px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.cc:hover{box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.cc.active{box-shadow:0 0 0 2.5px var(--accent);border-color:var(--accent)}
.cc.col3{grid-column:span 3}
.cc.col4{grid-column:span 4}
.cc.col6{grid-column:span 6}
.cc-title{font-size:9.5px;font-weight:500;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between}
.cc-hint{font-size:9px;color:var(--t3);font-weight:400;text-transform:none;letter-spacing:0}
.cw{position:relative;width:100%}

/* DETAIL PANEL */
.detail-panel{flex:1;overflow-y:auto;border-top:2px solid var(--border);background:var(--bg);min-height:0}
.detail-panel::-webkit-scrollbar{width:4px}
.detail-panel::-webkit-scrollbar-track{background:transparent}
.detail-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.detail-panel::-webkit-scrollbar-thumb:hover{background:var(--t3)}

.dtitle{font-size:11px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.05em;padding:1rem 1.2rem 0.5rem;display:flex;align-items:center;gap:8px;justify-content:space-between}
.badge{background:var(--s2);color:var(--t2);padding:2px 8px;border-radius:20px;font-size:9px;font-weight:500;text-transform:none;letter-spacing:0}
.tw{padding:0 1.2rem 1rem}
.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt th{background:var(--s2);padding:6px 8px;text-align:right;font-weight:600;color:var(--text);border-bottom:1px solid var(--border)}
.dt th:first-child{text-align:left}
.dt td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;color:var(--t2)}
.dt td:first-child{text-align:left;font-weight:500;color:var(--text)}
.dt tr:hover{background:var(--s2)}
.dt tr:last-child{font-weight:600;background:var(--s2)}
.dt .best{color:var(--green);font-weight:600}
.dt .pos{color:var(--green);font-weight:600}
.dt .neg{color:#B53C3C;font-weight:600}

/* PDF Export styles */
@media print {
  body { background: white; }
  #upload-screen, header, .fbar { display: none !important; }
  #app { min-height: auto; }
  .detail-panel { flex: none; }
  .cc { page-break-inside: avoid; }
}

.fade{opacity:.8}
</style>
</head>
<body>

<!-- UPLOAD SCREEN -->
<div id="upload-screen">
  <div class="brand">
    <h1>Sadhana <em>Dashboard</em></h1>
    <p>Upload your Excel file to get started</p>
  </div>
  <div class="drop-zone" id="drop-zone">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </div>
    <h3>Drop your Excel file here</h3>
    <p>or click to select</p>
    <input type="file" id="file-input" accept=".xlsx,.xls" />
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="hbrand">Sadhana <span>Dashboard</span></div>
    <div class="hright">
      <span class="fname" id="fname"></span>
      <button class="btn-export" id="btn-pdf">📄 Export PDF</button>
      <button class="btn-sm" id="btn-reset">Reset</button>
    </div>
  </header>

  <!-- FILTERS -->
  <div class="fbar">
    <div class="fgrp">
      <label>Year:</label>
      <select class="select-box" id="year-filter">
        <option value="">All Years</option>
      </select>
    </div>

    <div class="fgrp">
      <label>Month:</label>
      <div id="mf" style="display:flex;gap:3px;flex-wrap:wrap"></div>
    </div>

    <div class="fgrp">
      <label>Custom Date:</label>
      <input type="date" class="date-input" id="date-from" placeholder="From">
      <span style="color:var(--t3);font-size:10px">to</span>
      <input type="date" class="date-input" id="date-to" placeholder="To">
      <button class="fpill" id="btn-apply-date">Apply</button>
      <button class="fpill" id="btn-clear-date">Clear</button>
    </div>

    <div class="fgrp">
      <label>View:</label>
      <div id="vf" style="display:flex;gap:3px">
        <button class="fpill active" data-view="monthly">Monthly</button>
        <button class="fpill" data-view="quarterly">Quarterly</button>
        <button class="fpill" data-view="yearly">Yearly</button>
      </div>
    </div>
  </div>

  <!-- BODY -->
  <div class="body-wrap">
    <!-- DASHBOARD GRID -->
    <div class="dgrid">
      <div class="kpi-row" id="kpi-row"></div>
      <div class="cc col6" id="cc-profit"><div class="cc-title">📊 Profit Trend</div><div class="cw"><canvas id="profit-chart"></canvas></div></div>
      <div class="cc col3" id="cc-cash"><div class="cc-title">💰 Payment Method</div><div class="cw"><canvas id="cash-chart"></canvas></div></div>
      <div class="cc col3" id="cc-exp"><div class="cc-title">💸 Expense Category</div><div class="cw"><canvas id="exp-chart"></canvas></div></div>
      <div class="cc col12" id="cc-trend"><div class="cc-title">📈 Monthly Trend</div><div class="cw"><canvas id="trend-chart"></canvas></div></div>
    </div>

    <!-- DETAIL PANEL -->
    <div class="detail-panel" id="detail-panel"></div>
  </div>
</div>

<script>
// ── CONSTANTS ──
const MONTH_ORDER=['Jan 2022','Feb 2022','Mar 2022','Apr 2022','May 2022','Jun 2022','Jul 2022','Aug 2022','Sep 2022','Oct 2022','Nov 2022','Dec 2022','Jan 2023','Feb 2023','Mar 2023','Apr 2023','May 2023','Jun 2023','Jul 2023','Aug 2023','Sep 2023','Oct 2023','Nov 2023','Dec 2023','Jan 2024','Feb 2024','Mar 2024','Apr 2024','May 2024','Jun 2024','Jul 2024','Aug 2024','Sep 2024','Oct 2024','Nov 2024','Dec 2024','Jan 2025','Feb 2025','Mar 2025','Apr 2025','May 2025','Jun 2025','Jul 2025','Aug 2025','Sep 2025','Oct 2025','Nov 2025','Dec 2025','Jan 2026','Feb 2026','Mar 2026','Apr 2026'];
const EXP_COLORS=['#C4623A','#1B4F8A','#2D6A4F','#534AB7','#B8862A','#B53C3C','#8B5A3C','#6B8E23'];

// ── STATE ──
let allData={};
let currentView='monthly';
let currentFilter=null;
let activeDetail=null;
let currentDateRange=null;
let charts={};

// ── HELPERS ──
function pn(v){if(v===null||v===undefined||v==='')return 0;const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}
function fmt(n){n=Math.round(n);if(n>=10000000)return(n/10000000).toFixed(1)+'Cr';if(n>=100000)return(n/100000).toFixed(1)+'L';if(n>=1000)return(n/1000).toFixed(1)+'K';return n.toLocaleString('en-IN');}
function fmtR(n){return'₹'+Math.round(n).toLocaleString('en-IN');}

function normLabel(s){
  return s.trim()
    .replace(/^january\s*/i,'Jan ').replace(/^february\s*/i,'Feb ').replace(/^march\s*/i,'Mar ')
    .replace(/^april\s*/i,'Apr ').replace(/^june\s*/i,'Jun ').replace(/^july\s*/i,'Jul ')
    .replace(/^august\s*/i,'Aug ').replace(/^september\s*/i,'Sep ').replace(/^october\s*/i,'Oct ')
    .replace(/^november\s*/i,'Nov ').replace(/^december\s*/i,'Dec ').trim();
}

function extractMonth(rows){
  const d={sale:0,expense:0,profit:0,mulbhag:0,cash:0,transfer:0,expCats:{},daily:[]};
  let colDate=0,colProfit=3,colMulbhag=2,colActual=4,colCash=6,colTransfer=7;
  const hdr=rows[0];
  if(hdr){
    hdr.forEach((h,i)=>{
      const hl=String(h||'').toLowerCase().trim();
      if(hl==='date')colDate=i;
      else if(hl==='profit')colProfit=i;
      else if(hl==='mulbhag'||hl==='mul bhag')colMulbhag=i;
      else if(hl==='actual')colActual=i;
      else if(hl==='cash')colCash=i;
      else if(hl==='account transfer'||hl==='transfer'||hl==='online')colTransfer=i;
    });
  }
  for(let i=1;i<Math.min(rows.length,50);i++){
    const r=rows[i];if(!r||!r[colDate])continue;
    const ds=String(r[colDate]);if(!/\d{4}/.test(ds))continue;
    const cash=pn(r[colCash]),transfer=pn(r[colTransfer]);
    const total=cash+transfer;
    const profit=pn(r[colProfit]),mulbhag=pn(r[colMulbhag]),actual=pn(r[colActual]);
    if(total===0&&profit===0&&cash===0)continue;
    let day=d.daily.length+1;
    const dateRaw=ds;
    try{if(ds.includes('-'))day=parseInt(ds.split('-')[2])||day;else if(ds.includes('/'))day=parseInt(ds.split('/')[1])||day;}catch(e){}
    d.daily.push({day,dateRaw,profit,mulbhag,actual,total,cash,transfer});
    d.profit+=profit;d.mulbhag+=mulbhag;d.cash+=cash;d.transfer+=transfer;
  }
  for(let i=0;i<rows.length;i++){
    const r=rows[i];if(!r)continue;
    const c0=String(r[0]||'').trim();
    if(c0==='Sale'&&r[1])d.sale=pn(r[1]);
  }
  if(d.sale===0&&d.daily.length>0)d.sale=d.daily.reduce((s,x)=>s+x.total,0);
  d.expense=d.daily.reduce((s,x)=>s+0,0)+Object.values(d.expCats).reduce((s,x)=>s+x,0);
  return d;
}

function extractExpCats(rows){
  const cats={},items=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r)continue;
    const dt=String(r[0]||'').trim();
    if(!dt||dt==='Date'||dt==='NaN'||dt==='')continue;
    if(!/\d/.test(dt))continue;
    const cash=pn(r[1]),transfer=pn(r[2]);
    const total=cash+transfer>0?cash+transfer:pn(r[3]);
    const remarks=String(r[4]||'').trim();
    const type=String(r[5]||'').trim();
    if(!type||total===0)continue;
    if(['type of expense','type','total','grand total','row labels'].includes(type.toLowerCase()))continue;
    let day=0;
    try{const pd=new Date(dt);if(!isNaN(pd))day=pd.getDate();}catch(e){}
    items.push({day,date:dt,type,remarks,total,cash,transfer});
  }
  for(let i=0;i<rows.length;i++){
    const r=rows[i];if(!r)continue;
    const lbl=String(r[12]||'').trim();
    const val=pn(r[13]);
    if(!lbl||val===0)continue;
    if(['row labels','(blank)','grand total','sum of total',''].includes(lbl.toLowerCase()))continue;
    cats[lbl]=(cats[lbl]||0)+val;
  }
  if(!Object.keys(cats).length){
    items.forEach(it=>{cats[it.type]=(cats[it.type]||0)+it.total;});
  }
  return{cats,items};
}

function loadData(arrayBuffer){
  const workbook=XLSX.read(arrayBuffer,{type:'array'});
  allData={};
  workbook.SheetNames.forEach(name=>{
    const rows=XLSX.utils.sheet_to_json(workbook.Sheets[name],{header:0,defval:''});
    const normalizedName=normLabel(name);
    if(!normalizedName||normalizedName.length<5)return;
    if(name.toLowerCase().includes('expense')){
      const{cats,items}=extractExpCats(rows);
      if(allData[normalizedName]){
        Object.entries(cats).forEach(([k,v])=>{allData[normalizedName].expCats[k]=(allData[normalizedName].expCats[k]||0)+v;});
        allData[normalizedName].expItems=[...allData[normalizedName].expItems,...items];
      }
    }else{
      const md=extractMonth(rows);
      if(md.sale>0||md.daily.length>0){
        allData[normalizedName]=md;
      }
    }
  });
  
  // Calculate expense totals
  Object.keys(allData).forEach(m=>{
    const d=allData[m];
    d.expense=Object.values(d.expCats||{}).reduce((s,x)=>s+x,0);
  });
}

function sortedMonths(){
  const months=Object.keys(allData);
  const monthOrder=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months.sort((a,b)=>{
    const[aMonth,aYear]=a.split(' ');
    const[bMonth,bYear]=b.split(' ');
    const aY=parseInt(aYear)||0;
    const bY=parseInt(bYear)||0;
    if(aY!==bY)return aY-bY;
    return monthOrder.indexOf(aMonth)-monthOrder.indexOf(bMonth);
  });
}

function getYears(){
  const years=new Set();
  Object.keys(allData).forEach(m=>{
    const[,year]=m.split(' ');
    if(year)years.add(year);
  });
  return Array.from(years).sort();
}

function getMonthsForYear(year){
  const monthOrder=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return sortedMonths().filter(m=>{
    const[,y]=m.split(' ');
    return year?y===year:true;
  }).sort((a,b)=>{
    const[aMonth]=a.split(' ');
    const[bMonth]=b.split(' ');
    return monthOrder.indexOf(aMonth)-monthOrder.indexOf(bMonth);
  });
}

function buildFilters(){
  // Year filter
  const yearSelect=document.getElementById('year-filter');
  yearSelect.innerHTML='<option value="">All Years</option>';
  getYears().forEach(y=>{
    const opt=document.createElement('option');
    opt.value=y;
    opt.textContent=y;
    yearSelect.appendChild(opt);
  });
  yearSelect.addEventListener('change',()=>{
    currentFilter=null;
    currentDateRange=null;
    document.getElementById('date-from').value='';
    document.getElementById('date-to').value='';
    buildMonthButtons();
    renderAll();
  });

  buildMonthButtons();
}

function buildMonthButtons(){
  const selectedYear=document.getElementById('year-filter').value;
  const months=getMonthsForYear(selectedYear);
  const mf=document.getElementById('mf');
  mf.innerHTML='';
  months.forEach(m=>{
    const b=document.createElement('button');
    b.className='fpill';
    b.textContent=m;
    b.dataset.month=m;
    b.onclick=()=>{currentFilter=m;currentDateRange=null;setActivePill('month',m);activeDetail=null;renderAll();};
    mf.appendChild(b);
  });
}

function setActivePill(type,val){
  document.querySelectorAll('[data-month]').forEach(b=>b.classList.toggle('active',b.dataset.month===val));
}

function getActiveMonths(){
  if(currentDateRange){
    const{start,end}=currentDateRange;
    return sortedMonths().filter(m=>{
      const[month,year]=m.split(' ');
      const d=new Date(year,['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(month),15);
      return d>=start&&d<=end;
    });
  }
  const selectedYear=document.getElementById('year-filter').value;
  if(selectedYear){
    const months=getMonthsForYear(selectedYear);
    if(currentFilter&&months.includes(currentFilter))return[currentFilter];
    return months;
  }
  if(currentFilter)return[currentFilter];
  return sortedMonths();
}

function getCurrentData(){
  const ml=getActiveMonths();
  return ml.length===1?(allData[ml[0]]||{}):agg(ml);
}

function agg(mList){
  const o={sale:0,expense:0,profit:0,mulbhag:0,cash:0,transfer:0,expCats:{},expItems:[],daily:[]};
  mList.forEach(m=>{
    const d=allData[m];if(!d)return;
    o.sale+=d.sale;o.expense+=d.expense;o.profit+=d.profit;o.mulbhag+=d.mulbhag;o.cash+=d.cash;o.transfer+=d.transfer;
    o.daily=o.daily.concat(d.daily||[]);
    o.expItems=o.expItems.concat(d.expItems||[]);
    Object.entries(d.expCats||{}).forEach(([k,v])=>o.expCats[k]=(o.expCats[k]||0)+v);
  });
  return o;
}

// ── RENDER KPIs ──
function renderKPIs(data){
  const net=data.sale-data.expense;
  const kpis=[
    {l:'Total Sale',v:fmt(data.sale),kc:'#C4623A',key:'profit'},
    {l:'Total Expense',v:fmt(data.expense),kc:'#B53C3C',cls:'neg',key:'exp'},
    {l:'Net (Sale−Exp)',v:(net<0?'−':'')+fmt(Math.abs(net)),kc:net>=0?'#2D6A4F':'#B53C3C',cls:net>=0?'pos':'neg',key:'trend'},
    {l:'Gross Profit',v:fmt(data.profit),kc:'#2D6A4F',cls:'pos',sub:'Mulbhag: ₹'+fmt(data.mulbhag),key:'profit'},
    {l:'Cash Collected',v:fmt(data.cash),kc:'#1B4F8A',key:'cash'},
    {l:'Online/Transfer',v:fmt(data.transfer),kc:'#534AB7',key:'cash'},
  ];
  document.getElementById('kpi-row').innerHTML=kpis.map(k=>`
    <div class="kpi ${activeDetail===k.key?'active':''}" style="--kc:${k.kc}" onclick="showDetail('${k.key}')">
      <div class="kpi-lbl">${k.l}</div>
      <div class="kpi-val ${k.cls||''}">₹${k.v}</div>
      ${k.sub?`<div class="kpi-sub">${k.sub}</div>`:''}
    </div>`).join('');
}

// ── RENDER CHARTS ──
function renderProfitChart(data,mList){
  const ctx=document.getElementById('profit-chart');
  if(!ctx)return;
  
  const isM=mList.length>1;
  if(charts.profit)charts.profit.destroy();
  
  charts.profit=new Chart(ctx,{
    type:'bar',
    data:{
      labels:isM?mList:data.daily.map(d=>'D'+(d.day||1)),
      datasets:[
        {label:'Sale',data:isM?mList.map(m=>(allData[m]||{}).sale||0):data.daily.map(d=>d.total||0),backgroundColor:'#C4623A'},
        {label:'Profit',data:isM?mList.map(m=>(allData[m]||{}).profit||0):data.daily.map(d=>d.profit||0),backgroundColor:'#2D6A4F'}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:9},usePointStyle:true}}},scales:{y:{beginAtZero:true}}}
  });
}

function renderTrendChart(months){
  const ctx=document.getElementById('trend-chart');
  if(!ctx)return;
  if(charts.trend)charts.trend.destroy();
  
  const data=months.map(m=>(allData[m]||{}).sale||0);
  charts.trend=new Chart(ctx,{
    type:'line',
    data:{
      labels:months,
      datasets:[{label:'Monthly Sale',data:data,borderColor:'#C4623A',backgroundColor:'rgba(196,98,58,0.1)',borderWidth:2,fill:true,tension:0.4}]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:9}}}},scales:{y:{beginAtZero:true}}}
  });
}

function renderCashChart(data,mList){
  const ctx=document.getElementById('cash-chart');
  if(!ctx)return;
  if(charts.cash)charts.cash.destroy();
  
  const total=data.cash+data.transfer;
  charts.cash=new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['Cash','Online'],
      datasets:[{data:[data.cash,data.transfer],backgroundColor:['#1B4F8A','#534AB7']}]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:9}}}}}
  });
}

function renderExpChart(expCats){
  const ctx=document.getElementById('exp-chart');
  if(!ctx)return;
  if(charts.exp)charts.exp.destroy();
  
  const entries=Object.entries(expCats||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  charts.exp=new Chart(ctx,{
    type:'pie',
    data:{
      labels:entries.map(([k])=>k),
      datasets:[{data:entries.map(([,v])=>v),backgroundColor:EXP_COLORS}]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:9}}}}}
  });
}

// ── RENDER ALL ──
function renderAll(){
  const months=sortedMonths();
  const mList=getActiveMonths();
  const data=getCurrentData();
  
  renderKPIs(data);
  renderProfitChart(data,mList);
  renderTrendChart(months);
  renderCashChart(data,mList);
  renderExpChart(data.expCats);
  
  const html=`
    <div class="dtitle fade">📊 Summary <span class="badge">${mList.join(' · ')}</span></div>
    <div class="tw">
      <table class="dt">
        <thead><tr><th>Metric</th><th>Amount</th></tr></thead>
        <tbody>
          <tr><td>Total Sale</td><td>${fmtR(data.sale)}</td></tr>
          <tr><td>Total Expense</td><td>${fmtR(data.expense)}</td></tr>
          <tr><td>Gross Profit</td><td>${fmtR(data.profit)}</td></tr>
          <tr><td>Mulbhag</td><td>${fmtR(data.mulbhag)}</td></tr>
          <tr><td>Cash</td><td>${fmtR(data.cash)}</td></tr>
          <tr><td>Online</td><td>${fmtR(data.transfer)}</td></tr>
        </tbody>
      </table>
    </div>
  `;
  
  document.getElementById('detail-panel').innerHTML=html;
}

// ── UPLOAD ──
document.getElementById('file-input').addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=evt=>{
    loadData(evt.target.result);
    document.getElementById('fname').textContent=file.name;
    document.getElementById('upload-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    buildFilters();
    renderAll();
  };
  reader.readAsArrayBuffer(file);
});

document.getElementById('drop-zone').addEventListener('dragover',e=>{e.preventDefault();document.getElementById('drop-zone').classList.add('drag-over');});
document.getElementById('drop-zone').addEventListener('dragleave',()=>{document.getElementById('drop-zone').classList.remove('drag-over');});
document.getElementById('drop-zone').addEventListener('drop',e=>{
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag-over');
  const file=e.dataTransfer.files[0];
  if(file)document.getElementById('file-input').files=e.dataTransfer.files;
  const evt=new Event('change',{bubbles:true});
  document.getElementById('file-input').dispatchEvent(evt);
});

// ── DATE RANGE ──
document.getElementById('btn-apply-date').addEventListener('click',()=>{
  const from=document.getElementById('date-from').value;
  const to=document.getElementById('date-to').value;
  if(from&&to){
    currentDateRange={start:new Date(from),end:new Date(to)};
    currentFilter=null;
    document.getElementById('year-filter').value='';
    buildMonthButtons();
    renderAll();
  }
});

document.getElementById('btn-clear-date').addEventListener('click',()=>{
  currentDateRange=null;
  document.getElementById('date-from').value='';
  document.getElementById('date-to').value='';
  document.getElementById('year-filter').value='';
  buildMonthButtons();
  renderAll();
});

// ── PDF EXPORT ──
document.getElementById('btn-pdf').addEventListener('click',()=>{
  const element=document.getElementById('app');
  const opt={
    margin:10,
    filename:'Sadhana-Dashboard.pdf',
    image:{type:'jpeg',quality:0.98},
    html2canvas:{scale:2},
    jsPDF:{orientation:'portrait',unit:'mm',format:'a4'}
  };
  html2pdf().set(opt).from(element).save();
});

// ── RESET ──
document.getElementById('btn-reset').addEventListener('click',()=>{
  if(confirm('Reset all filters?')){
    currentFilter=null;
    currentDateRange=null;
    document.getElementById('year-filter').value='';
    document.getElementById('date-from').value='';
    document.getElementById('date-to').value='';
    buildMonthButtons();
    renderAll();
  }
});

// ── VIEW TOGGLE ──
document.querySelectorAll('[data-view]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentView=btn.dataset.view;
    activeDetail=null;
    renderAll();
  });
});

function showDetail(key){
  activeDetail=activeDetail===key?null:key;
  renderAll();
}
</script>
</body>
</html>
